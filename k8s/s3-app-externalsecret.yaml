# Reader of the S3 app credentials for skirmshop-drive-mirror (SC-495, DGX-130).
# Provider is vault-backend (ClusterSecretStore, KV v2): remoteRef.key is the
# mount-relative path op/skirmshop-drive-s3-app (op-mirror of the 1Password item),
# one property per field. refreshInterval 6h per the Families quota rule.
# target/template unchanged.
#
# The ClusterPushSecret that used to write the item from the seed Secret
# backup-hub/skirmshop-drive-s3-app was retired under SC-495 (CTO ruling
# 12-09): the values are already seeded by hand in 1Password, the MinIO
# provisioner (migrated to op in k8s-infra PR #108) is the single writer, and
# the CPS Errored retries were burning 1Password account quota. The item is
# edited with `op item edit skirmshop-drive-s3-app ... --vault k8s-pocharlies`.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: skirmshop-drive-s3-app
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  externalSecretName: skirmshop-drive-s3-app
  namespaces:
    - skirmshop
    - whatsapp-mcp
    - skirmshop-brain-prod
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 6h
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    target:
      name: skirmshop-drive-s3-app
      creationPolicy: Orphan
      deletionPolicy: Retain
      template:
        engineVersion: v2
        mergePolicy: Replace
        metadata:
          labels:
            app.kubernetes.io/name: skirmshop-drive-mirror
            app.kubernetes.io/component: s3-credentials
    data:
      - secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: AWS_ACCESS_KEY_ID
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
      - secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: AWS_SECRET_ACCESS_KEY
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
      - secretKey: AWS_REGION
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: AWS_REGION
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
      - secretKey: AWS_S3_FORCE_PATH_STYLE
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: AWS_S3_FORCE_PATH_STYLE
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
      - secretKey: S3_BUCKET
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: S3_BUCKET
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
      - secretKey: S3_ENDPOINT
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: S3_ENDPOINT
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
      - secretKey: S3_REGION
        remoteRef:
          key: op/skirmshop-drive-s3-app
          property: S3_REGION
          decodingStrategy: None
          conversionStrategy: Default
          metadataPolicy: None
          nullBytePolicy: Ignore
