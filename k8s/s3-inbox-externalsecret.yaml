# SC-4759: identidad del inbox móvil (POST /api/app/inbox del dashboard). La consume
# el Job skirmshop-drive-s3-bootstrap para crear el usuario MinIO acotado por la
# política skirmshop-drive-inbox-rw (sólo PutObject bajo personal/inbox/ de
# skirmshop-drive); el dashboard lee el mismo item en control-nexus
# (dgx-infra: k8s/control-nexus/dashboard-inbox-s3-externalsecret.yaml).
# No es la clave compartida `app`: skirmshop-drive-rw cubre el bucket entero y la
# usan el mirror-to-drive, skirmbooks y el brain.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmshop-drive-s3-inbox
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: skirmshop-drive-s3-inbox
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: skirmshop-drive-s3-inbox
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: skirmshop-drive-s3-inbox
        property: AWS_SECRET_ACCESS_KEY
