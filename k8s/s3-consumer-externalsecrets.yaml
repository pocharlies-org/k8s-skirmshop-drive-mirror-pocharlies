# SKIRM-478: bundles de revisión privada (hideout-review, SKIRM-470). Runtime de SOLO
# LECTURA del prefijo hideout-review/* (política skirmshop-drive-hideout-review-ro: sin
# PutObject ni DeleteObject). Lo consume el initContainer rclone del overlay
# private-review de k8s-shopify-bundles-pocharlies (Secret skirmshop-drive-s3-bundles).
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: skirmshop-drive-s3-bundles
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  externalSecretName: skirmshop-drive-s3-bundles
  namespaces:
    - skirmshop
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 24h
    secretStoreRef:
      name: onepassword
      kind: ClusterSecretStore
    target:
      name: skirmshop-drive-s3-bundles
      creationPolicy: Owner
      deletionPolicy: Retain
    data:
      - secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          key: skirmshop-drive-s3-bundles/AWS_ACCESS_KEY_ID
      - secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          key: skirmshop-drive-s3-bundles/AWS_SECRET_ACCESS_KEY
      - secretKey: AWS_REGION
        remoteRef:
          key: skirmshop-drive-s3-bundles/AWS_REGION
      - secretKey: AWS_S3_FORCE_PATH_STYLE
        remoteRef:
          key: skirmshop-drive-s3-bundles/AWS_S3_FORCE_PATH_STYLE
      - secretKey: S3_BUCKET
        remoteRef:
          key: skirmshop-drive-s3-bundles/S3_BUCKET
      - secretKey: S3_ENDPOINT
        remoteRef:
          key: skirmshop-drive-s3-bundles/S3_ENDPOINT
      - secretKey: S3_REGION
        remoteRef:
          key: skirmshop-drive-s3-bundles/S3_REGION
---
