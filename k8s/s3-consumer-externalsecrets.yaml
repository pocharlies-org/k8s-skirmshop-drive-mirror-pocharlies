      - secretKey: AWS_REGION
        remoteRef:
          key: skirmshop-drive-s3-bundles-upload/AWS_REGION
      - secretKey: AWS_S3_FORCE_PATH_STYLE
        remoteRef:
          key: skirmshop-drive-s3-bundles-upload/AWS_S3_FORCE_PATH_STYLE
