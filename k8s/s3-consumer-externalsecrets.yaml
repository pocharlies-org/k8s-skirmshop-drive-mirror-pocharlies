# Una clave de MinIO por consumidor del bucket skirmshop-drive (24-09-2026).
# Cada app tiene su propio usuario en skirmshop-drive-s3 (misma politica
# skirmshop-drive-rw que la clave compartida, pero revocable y auditable por
# separado) y su propio item de 1Password `skirmshop-drive-s3-<consumidor>`
# con los mismos siete campos que skirmshop-drive-s3-app. Cada app lee su
# Secret `skirmshop-drive-s3-<consumidor>` en lugar de skirmshop-drive-s3-app.
#
# ClusterExternalSecret y no ExternalSecret porque la kustomization fija
# `namespace: backup-hub` para todo lo namespaced.
---
# shopify-affiliate
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: skirmshop-drive-s3-affiliate
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  externalSecretName: skirmshop-drive-s3-affiliate
  namespaces:
    - skirmshop
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 24h
    secretStoreRef:
      name: onepassword
      kind: ClusterSecretStore
    target:
      name: skirmshop-drive-s3-affiliate
      creationPolicy: Owner
      deletionPolicy: Retain
    data:
      - secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          key: skirmshop-drive-s3-affiliate/AWS_ACCESS_KEY_ID
      - secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          key: skirmshop-drive-s3-affiliate/AWS_SECRET_ACCESS_KEY
      - secretKey: AWS_REGION
        remoteRef:
          key: skirmshop-drive-s3-affiliate/AWS_REGION
      - secretKey: AWS_S3_FORCE_PATH_STYLE
        remoteRef:
          key: skirmshop-drive-s3-affiliate/AWS_S3_FORCE_PATH_STYLE
      - secretKey: S3_BUCKET
        remoteRef:
          key: skirmshop-drive-s3-affiliate/S3_BUCKET
      - secretKey: S3_ENDPOINT
        remoteRef:
          key: skirmshop-drive-s3-affiliate/S3_ENDPOINT
      - secretKey: S3_REGION
        remoteRef:
          key: skirmshop-drive-s3-affiliate/S3_REGION
---
