# CronJob skirmshop-drive-s3-to-drive (backup-hub): solo lee del bucket para
# copiarlo a Google Drive. Usuario drive-to-gdrive, politica skirmshop-drive-ro.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmshop-drive-s3-to-gdrive
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: skirmshop-drive-s3-to-gdrive
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: skirmshop-drive-s3-to-gdrive/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: skirmshop-drive-s3-to-gdrive/AWS_SECRET_ACCESS_KEY
