# SKIRM-478 (security): identidades de los bundles de revisión privada (hideout-review,
# SKIRM-470). Dos usuarios MinIO separados, ambos acotados al prefijo hideout-review/* de
# skirmshop-drive y sin DeleteObject (los paquetes publicados se versionan, no se borran):
#  - skirmshop-drive-s3-bundles: runtime de SOLO LECTURA (política
#    skirmshop-drive-hideout-review-ro: GetObject + ListBucket con s3:prefix
#    hideout-review/*). Lo consume el initContainer rclone del overlay private-review de
#    k8s-shopify-bundles-pocharlies vía CES homónimo en ns skirmshop.
#  - skirmshop-drive-s3-bundles-upload: vía autorizada de carga inicial (política
#    skirmshop-drive-hideout-review-upload: PutObject + multipart bajo hideout-review/*,
#    sin GetObject ni DeleteObject). Lo usa la sesión que publica el paquete; el runtime
#    no puede escribir con él.
# Estos dos ExternalSecret (ns backup-hub, sync-wave -1) alimentan sólo al Job
# skirmshop-drive-s3-bootstrap, que crea usuarios y políticas. Los valores los escribe
# security en 1Password (vault k8s-pocharlies), items skirmshop-drive-s3-bundles y
# skirmshop-drive-s3-bundles-upload.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmshop-drive-s3-bundles
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: skirmshop-drive-s3-bundles
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: skirmshop-drive-s3-bundles
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: skirmshop-drive-s3-bundles
        property: AWS_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: skirmshop-drive-s3-bundles-upload
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3-credentials
spec:
  refreshInterval: 24h
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: skirmshop-drive-s3-bundles-upload
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: skirmshop-drive-s3-bundles-upload
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: skirmshop-drive-s3-bundles-upload
        property: AWS_SECRET_ACCESS_KEY
