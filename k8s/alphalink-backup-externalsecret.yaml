# Credencial S3 de los backups restic de alphalinkcrossfit.com (droplet DO
# 206.189.15.5, fuera del cluster). Solo la consume el Job
# skirmshop-drive-s3-bootstrap para crear el usuario MinIO acotado al bucket
# alphalink-backups; el droplet lleva su copia en /root/.config/restic/env.
# El item de 1Password guarda además RESTIC_PASSWORD: sin él no se restaura.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alphalink-backup-s3
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: alphalink-backup-credentials
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: alphalink-backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: alphalink-backup-s3/AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: alphalink-backup-s3/AWS_SECRET_ACCESS_KEY
