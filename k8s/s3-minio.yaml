apiVersion: apps/v1
kind: Deployment
metadata:
  name: skirmshop-drive-s3
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skirmshop-drive-mirror
      app.kubernetes.io/component: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skirmshop-drive-mirror
        app.kubernetes.io/component: s3
      annotations:
        backup.velero.io/backup-volumes-excludes: data
    spec:
      restartPolicy: Always
      # INFRA-691: cogido con los datos (nfs-cold = sauvage:/srv/nfs/k8s-cold). Estando en
      # ubuntu, el montaje NFS hard del PVC dependía del enlace x86↔sauvage, que quedó
      # relayado por DERP durante horas → cuerpos incompletos en las escrituras y el drive
      # fuera de línea (caídas del 07-10 y del 14-10). El consumidor (telegram-sync) también
      # vive en sauvage: tras este cambio el enlace tailnet deja de estar en el camino crítico.
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: sauvage
      containers:
        - name: minio
          image: harbor.e-dani.com/homelab/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --address
            - :9000
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skirmshop-drive-s3-root
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_BROWSER_REDIRECT_URL
              value: https://skirmshop-s3-console.e-dani.com
            # Métricas de cluster para el VMServiceScrape «skirmshop-drive-s3»
            # (dgx-infra k8s/monitoring): sin token, asequibles solo desde la red del
            # clúster y desde LAN/tailnet por el ingress restringido; estadísticas
            # agregadas, sin datos de objetos ni credenciales.
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: s3-data
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skirmshop-drive-mirror
---
apiVersion: v1
kind: Service
metadata:
  name: skirmshop-drive-s3
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
