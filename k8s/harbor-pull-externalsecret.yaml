# harbor-pull: credencial de lectura de Harbor para las imágenes del namespace
# (minio en s3-minio.yaml, movida a Harbor en INFRA-633). SC-2552: SC-2514 puso
# el imagePullSecrets sin crear el secreto y el pod quedó 11 h en
# ImagePullBackOff en sauvage. Item único de 1Password vía Connect (forma
# key+property que exige ARCHITECTURE.md §4). El nombre es harbor-pull a
# propósito: adopta el ExternalSecret manual aplicado el 17-10 11:12Z, que ya
# es dueño del Secret (veredicto SC-2620).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: harbor-pull-credentials
    security.e-dani.com/rotation-class: runtime-registry
spec:
  refreshInterval: 24h
  refreshPolicy: Periodic
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          security.e-dani.com/rotation-class: runtime-registry
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: infra-harbor-k8s-runtime-pull
        property: dockerconfigjson
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
