# SC-2550: el minio del drive (s3-minio.yaml) tira de harbor.e-dani.com desde
# INFRA-633 y SC-2514 le añadió imagePullSecrets: harbor-pull, pero el secreto no
# existía en backup-hub → el pod nuevo del RS se quedó en ImagePullBackOff y la app
# ArgoCD en Degraded (ARGO-15122). Mismo formato que los harbor-pull de blog, chat
# o correo: item de 1Password con el dockerconfigjson, vía Connect.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: harbor-credentials
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: onepassword-connect
    kind: ClusterSecretStore
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: infra-harbor-k8s-runtime-pull
        property: dockerconfigjson
