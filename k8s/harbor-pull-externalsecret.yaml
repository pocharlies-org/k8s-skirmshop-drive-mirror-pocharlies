# Credenciales de lectura de Harbor para backup-hub (INFRA-691).
# El Deployment y el Job de bootstrap tiran de harbor.e-dani.com/homelab
# (lección INFRA-633: minio/minio y minio/mc murieron en Docker Hub). backup-hub
# no tenía el patrón `harbor-pull` que usan los demás ns; mismo patrón que
# analytics-mcp: ExternalSecret desde 1Password (item infra-harbor-k8s-runtime-pull).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-runtime-pull
  labels:
    app.kubernetes.io/name: skirmshop-drive-mirror
    app.kubernetes.io/component: registry
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  refreshPolicy:
    interval: 24h
  target:
    name: harbor-pull
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
          security.e-dani.com/rotation-class: runtime-registry
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: infra-harbor-k8s-runtime-pull
        property: dockerconfigjson
